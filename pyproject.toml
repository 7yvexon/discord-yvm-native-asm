[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yul-vending-machine"
version = "0.1.0"
description = "Discord 입금 확인과 누적 후원 금액 기록 코어"
requires-python = ">=3.11"
dependencies = []
license = { file = "LICENSE" }

[project.scripts]
yul-vending-machine = "vending_machine.cli:main"

[tool.setuptools.packages.find]
include = ["vending_machine*"]
